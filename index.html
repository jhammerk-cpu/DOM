<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
</head>
<body>
<div id="counter">
    <h1> CLICK COUNTER:</h1>
<p>Clicks: <span id="clickCount">0</span></p>
<button id="clickButton">Click Me!</button>
</div>
<button id="HideClickCounter">Hide Click Counter</button> 
<form id="myForm">
    <label for="name">What you've typed so far: </label>
    <p id="typedText"></p>
    <input type="text" id="input" name="input" required>
</form>
<style>
    .hidden {
        display: none;
    }
</style>
<script src="script.js"></script>
</body>
</html>
